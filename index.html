<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê bàn thắng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= CSS = GIAO DIỆN (màu sắc, cỡ chữ, khoảng cách) =================
   Muốn đổi MÀU: sửa các dòng trong :root ngay bên dưới.
     --op  = màu "Trực tiếp" (xanh lá)     --pe = màu "Penalty" (vàng)
     --fk  = màu "Đá phạt" (xanh dương)    --un = màu "Chưa phân loại" (xám)
     --hd  = màu nền phần đầu trang        --bg = màu nền trang
     --veil = lớp phủ tối lên toàn bộ ảnh nền (số cuối của rgba: 0 = không phủ, .5 = phủ nhiều)
     --card-op = độ đặc của các thẻ trắng (nhỏ hơn = trong hơn, thấy ảnh nền nhiều hơn)
     --blur = độ mờ của ảnh nền ở phía sau các thẻ (0px = không mờ)
     --bh  = chiều cao tối đa của cột (đang tự co theo chiều cao màn hình;
             muốn cột cao hơn thì giảm số 586, muốn thấp hơn thì tăng số 586)
   Khối @media (prefers-color-scheme:dark) là màu khi máy bật chế độ tối. */
:root{--bg:#eef1ee;--card:#fff;--tx:#14231c;--mu:#36423b;--line:#d9dfdb;--hd:#0f3d2e;--op:#1f7a4d;--pe:#e3a21a;--fk:#2f6fb5;--un:#6b7872;
  --bh:clamp(50px,calc(100vh - 586px),240px);
  --veil:rgba(0,0,0,.08);
  --card-op:62%;   /* ĐỘ ĐẶC của các thẻ: 100% = đặc hẳn, càng nhỏ càng trong (thử 45% - 75%; thấp quá thì chữ khó đọc) */
  --blur:0px}      /* ĐỘ MỜ của ảnh nền sau thẻ: 0px = ảnh nét, 4px = mờ nhẹ, 8px = mờ nhiều */
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#17211b;--tx:#eaf1ec;--mu:#97a69d;--line:#2a3830;--hd:#0a2a20;--op:#3fae77;--pe:#f0b43a;--fk:#5b9be0;--un:#56635b;--veil:rgba(0,0,0,.15)}}
/* ----- Khung chung: font chữ, nền trang ----- */
*{box-sizing:border-box}
/* ẢNH NỀN: img/nen.png (nằm cạnh logo.png). Chưa có ảnh thì tự dùng màu --bg.
   Đổi tên/đường dẫn: sửa url("img/nen.png"). center/cover = phủ kín trang, fixed = ảnh đứng yên khi cuộn. */
body{margin:0;background:linear-gradient(var(--veil),var(--veil)),url("img/nen.png") center/cover no-repeat fixed,var(--bg);color:var(--tx);font:14px/1.4 "Be Vietnam Pro",system-ui,sans-serif}
.num,h1,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px}
/* ----- PHẦN ĐẦU TRANG: logo (trái) | tên + ngày sinh (giữa) | ảnh (phải) -----
   Đổi kích thước logo/ảnh: sửa 56px ở .hero (grid-template-columns) và .hero img */
header{background:var(--hd);color:#fff;padding:8px 0}
.hero{border:2px solid rgba(255,255,255,.22);border-radius:6px;padding:6px 14px;display:grid;grid-template-columns:56px 1fr 56px;gap:14px;align-items:center}
.hero img{width:56px;height:56px;object-fit:contain;display:block}
.hero img.ph{object-fit:cover;border-radius:8px}
.ctr{text-align:center}
h1{margin:0;font-size:1.8rem;font-weight:700;letter-spacing:.03em;line-height:1.05}
.dob{opacity:.85;font-size:.9rem}
/* ----- Khung nội dung chính và thẻ trắng (.card) ----- */
main{max-width:1280px;margin:0 auto;padding:8px 14px}
/* Thẻ trắng: độ đặc và độ mờ chỉnh ở --card-op và --blur trong :root (đầu phần CSS) */
.card{background:var(--card);background:color-mix(in srgb,var(--card) var(--card-op),transparent);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin:0 0 8px}
h2{margin:0 0 8px;font-size:.95rem;font-weight:600}
/* ----- Ô TỔNG SỐ BÀN: số to bên trái, 3 loại bàn thắng bên phải, thanh chia màu bên dưới ----- */
.kpi{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center}
.lab{color:var(--mu);font-size:.8rem}
.big{font-size:2.8rem;font-weight:700;line-height:.95}
.big small{font-size:1rem;font-weight:600;margin-left:6px;color:var(--mu)}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.leg>div{border-left:6px solid;padding-left:10px}
.leg .num{font-size:1.5rem;font-weight:700;line-height:1}
.leg span{display:block;color:var(--mu);font-size:.8rem}
.sb{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line);grid-column:1/-1}
.sb i{display:block;height:100%}
i.op{background:var(--op)}i.pe{background:var(--pe)}i.fk{background:var(--fk)}i.un{background:var(--un)}
/* ----- HÀNG DANH HIỆU (nằm cuối ô tổng số bàn) -----
   .h = 1 danh hiệu | .pic = ảnh minh họa (40px, đổi ở width/height) | .hc = số lần (×5) | .hn = tên danh hiệu
   minmax(150px,1fr): mỗi danh hiệu rộng tối thiểu 150px, hết chỗ thì tự xuống hàng */
.hon{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.hon[hidden]{display:none}
.h{display:flex;align-items:center;gap:8px;min-width:0}
.pic{position:relative;width:40px;height:40px;flex:none}
.pic .b2,.pic img{position:absolute;inset:0;width:100%;height:100%;border-radius:8px}
.pic .b2{background:var(--pe);color:#2b1d00;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.pic img{object-fit:contain}
.ht{display:flex;flex-direction:column;min-width:0}
.hc{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.4rem;font-weight:700;line-height:1}
.hn{font-size:.75rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ----- HÀNG NÚT LỌC ĐỘI + giờ cập nhật + nút Làm mới ----- */
.tb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:4px 12px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--pe);outline-offset:2px}
.chips button[aria-pressed=true]{background:var(--hd);color:#fff;border-color:var(--hd)}
.right{display:flex;align-items:center;gap:10px;white-space:nowrap;background:var(--card);padding:3px 4px 3px 12px;border-radius:6px}
.note{color:var(--mu);font-size:.8rem}
/* ----- BIỂU ĐỒ CỘT ĐỨNG THEO ĐỘI -----
   .tcol = 1 cột (min-width = độ rộng tối thiểu của mỗi cột đội)
   .tcol .stack{width:56px} = độ rộng thân cột
   .t = số bàn trên đầu cột, .nm = tên đội dưới cột */
.tcols{display:flex;align-items:flex-end;justify-content:space-evenly;gap:14px;overflow-x:auto;padding-bottom:4px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-size:.75rem;text-align:center}
.tcol{min-width:110px}
.t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.4rem;font-weight:700;line-height:1;color:var(--tx)}
.stack{display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;height:calc(var(--bh)*var(--r))}
.tcol .stack{width:56px}
.stack i{display:block;width:100%}
.nmrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:2px}
.nm{font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.02em;color:var(--tx)}
/* ----- Logo tròn dưới mỗi cột (width/height 28px = cỡ logo) ----- */
.lg{position:relative;width:28px;height:28px;flex:none}
.lg .badge,.lg img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.lg .badge{background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600}
.lg img{object-fit:contain;background:#fff}
/* ----- THANH TAB (Thống kê | Ảnh) ----- */
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tabs button[aria-pressed=true]{background:var(--op);color:#fff;border-color:var(--op)}
/* ----- TAB ẢNH -----
   .galwrap = khung cuộn riêng (chiều cao = màn hình trừ phần đầu trang) nên cả trang vẫn gọn một màn hình
   .gal = lưới ảnh dạng "gạch": column-width:220px = bề ngang mỗi cột ảnh (nhỏ hơn thì nhiều cột hơn)
   Ảnh ngang, dọc, vuông đều được giữ nguyên tỷ lệ, không bị cắt. column-gap / margin-bottom = khoảng cách giữa ảnh */
.galwrap{height:calc(100vh - 170px);min-height:200px;overflow-y:auto;border-radius:6px}
.gal{column-width:220px;column-gap:8px}
.gal img{width:100%;display:block;margin:0 0 8px;border-radius:6px;break-inside:avoid;cursor:zoom-in;background:var(--line)}
.galmsg{background:var(--card);padding:10px 14px;border-radius:6px}
/* ----- Xem ảnh phóng to (bấm vào ảnh) ----- */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:50}
.lb[hidden]{display:none}
.lb img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:4px}
.lb button{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.5rem;padding:0}
#lbx{top:14px;right:14px}#lbp{left:14px;top:50%}#lbn{right:14px;top:50%}
/* ----- BẢNG CHI TIẾT ĐỘI (hiện khi bấm vào một cột đội) -----
   .md = lớp nền tối | .mc = khung trắng ở giữa (width:min(800px,...) = độ rộng tối đa) | .mt = bảng từng mùa
   .hb = một danh hiệu (ảnh nhỏ + tên) | .pic.sm = cỡ ảnh nhỏ của danh hiệu (22px) */
.tcol[data-s]{cursor:pointer;border-radius:6px;padding:2px 4px}
.tcol[data-s]:hover,.tcol[data-s]:focus-visible{background:rgba(127,127,127,.2);outline:none}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
.md[hidden]{display:none}
.mc{position:relative;background:var(--card);color:var(--tx);border-radius:10px;padding:16px 18px;width:min(800px,100%);max-height:88vh;overflow:auto}
#mdx{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border-radius:50%}
.mh{display:flex;align-items:center;gap:12px;padding-right:40px}
.mh .lg{width:44px;height:44px}
.mn{font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.mtot{margin-left:auto;color:var(--mu);font-size:.9rem;white-space:nowrap}
.mtot b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2rem;color:var(--tx);margin-right:4px}
.mt th,.mt td{text-align:right;white-space:normal}
.mt th:first-child,.mt td:first-child,.mt th.hh,.mt td.hh{text-align:left}
.hb{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:.8rem}
.pic.sm{width:22px;height:22px}
.pic.sm .b2{font-size:.8rem;border-radius:5px}
.mo{margin:10px 0 0;font-size:.85rem}
/* ----- KHỐI "DANH HIỆU THEO MÙA" trong bảng chi tiết đội (.hsy = cột mùa, đổi min-width cho rộng/hẹp) ----- */
.hs{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.hst{font-weight:600;font-size:.9rem;margin-bottom:2px}
.hsr{display:flex;gap:12px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.hsy{min-width:100px;color:var(--mu);font-size:.85rem;flex:none}
/* ----- Bảng chi tiết từng mùa (mục bấm để mở) ----- */
details summary{cursor:pointer;font-weight:600;font-size:.95rem}
.scroll{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:500}
/* ----- Dòng thông báo màu vàng (khi lỗi hoặc dữ liệu mẫu) ----- */
.warn{background:var(--pe);color:#2b1d00;padding:6px 12px;border-radius:6px;margin-bottom:10px;font-size:.8rem}
/* ----- Màn hình nhỏ (điện thoại): xếp lại bố cục ----- */
@media(max-width:900px){.kpi{grid-template-columns:1fr}h1{font-size:1.5rem}}
</style>
</head>
<body>
<!-- ================= HTML = KHUNG TRANG (thứ tự các khối từ trên xuống) ================= -->
<!-- 1) PHẦN ĐẦU TRANG: logo.png | tên + ngày sinh | image.png (nội dung điền bằng CONFIG bên dưới) -->
<header><div class="wrap"><div class="hero">
  <img id="logoimg" alt="" onerror="this.style.visibility='hidden'">
  <div class="ctr"><h1 id="pname"></h1><div class="dob" id="pdob"></div></div>
  <img id="photoimg" class="ph" alt="" onerror="this.style.visibility='hidden'">
</div></div></header>
<!-- 2) NỘI DUNG CHÍNH -->
<main>
  <!-- Chỗ hiện dòng thông báo vàng (lỗi tải sheet / dữ liệu mẫu) -->
  <div id="warn"></div>
  <!-- Thanh tab: chuyển giữa Thống kê và Ảnh -->
  <div class="tabs"><button data-tab="stats" aria-pressed="true">Thống kê</button><button data-tab="photos" aria-pressed="false">Ảnh<span id="tabph"></span></button></div>

  <!-- ===== TAB THỐNG KÊ ===== -->
  <section id="tab-stats">
  <!-- Ô tổng số bàn + Trực tiếp / Penalty / Đá phạt (số liệu do JS điền) -->
  <div class="card kpi">
    <div><div class="lab" id="title">Tổng số bàn thắng</div><div class="big"><span id="total">0</span><small>bàn</small></div></div>
    <div class="leg" id="leg"></div>
    <div class="sb" id="mainbar"></div>
    <!-- Hàng danh hiệu: JS điền từ tab "Danh hiệu" của Google Sheet (ẩn nếu chưa có HONORS_URL) -->
    <div class="hon" id="honors" hidden></div>
  </div>
  <!-- Hàng nút lọc đội + giờ cập nhật + nút Làm mới -->
  <div class="tb">
    <div class="chips" id="chips"></div>
    <div class="right"><span class="note" id="status">Đang tải…</span><button id="refresh">Làm mới</button></div>
  </div>
  <!-- Biểu đồ cột đứng theo đội (đổi tiêu đề ở chữ trong <h2>) -->
  <div class="card"><h2>Bàn thắng theo đội bóng <span class="note">· bấm vào từng cột để xem chi tiết từng mùa và danh hiệu</span></h2><div class="tcols" id="teams"></div></div>
  <!-- Bảng chi tiết từng mùa (bấm để mở). Đổi tên mục ở chữ trong <summary> -->
  <details class="card"><summary>Chi tiết từng mùa</summary><div class="scroll"><table id="tbl"></table></div></details>
  </section>

  <!-- ===== TAB ẢNH: ảnh lấy từ thư mục img/anh/ (xem phần 9 trong JS) ===== -->
  <section id="tab-photos" hidden>
    <div class="galwrap"><div class="gal" id="gal"></div><p class="note galmsg" id="galmsg" hidden></p></div>
  </section>
</main>
<!-- Khung xem ảnh phóng to -->
<div class="lb" id="lb" hidden><button id="lbx" aria-label="Đóng">✕</button><button id="lbp" aria-label="Ảnh trước">‹</button><img id="lbi" alt=""><button id="lbn" aria-label="Ảnh sau">›</button></div>
<!-- Bảng chi tiết đội (hiện khi bấm một cột đội) -->
<div class="md" id="md" hidden><div class="mc" role="dialog" aria-modal="true"><button id="mdx" aria-label="Đóng">✕</button><div id="mdb"></div></div></div>
<script>
/* ================= JAVASCRIPT = XỬ LÝ SỐ LIỆU =================
   MỤC LỤC (tìm bằng Ctrl+F):
     1. CẤU HÌNH          - link sheet, tên, ngày sinh, thư mục ảnh  (hay sửa nhất)
     2. DỮ LIỆU MẪU       - hiện khi chưa nối sheet
     3. HÀM TIỆN ÍCH      - các hàm nhỏ dùng chung
     4. NHÃN & MÀU 3 LOẠI - tên 3 loại bàn thắng
     5. ĐỌC FILE CSV      - đọc bảng từ Google Sheet
     6. VẼ GIAO DIỆN      - hàm render(): tổng, nút lọc, biểu đồ, bảng
     7. TẢI TỪ SHEET      - toCsv(), load(), tự làm mới
     8. DANH HIỆU         - đọc tab Danh hiệu và vẽ hàng danh hiệu
     9. TAB ẢNH           - tự liệt kê ảnh trong thư mục, lưới ảnh, xem phóng to
    10. CHI TIẾT ĐỘI      - bấm cột đội -> bảng từng mùa: số bàn + danh hiệu
*/
/* ====== CẤU HÌNH ======
   Sheet: dòng 1 là tên cột, các dòng sau là dữ liệu. Cột Năm nên để định dạng "Văn bản thuần túy".
   SHEET_URL: dán link Google Sheet (hoặc thêm ?sheet=LINK vào địa chỉ trang).
   Sheet cần chia sẻ "Bất kỳ ai có đường liên kết đều xem được".
   Cột: Đội bóng | Năm | Tổng số bàn | Trực tiếp | Penalty | Đá phạt | Logo (tuỳ chọn, link ảnh) */
const CONFIG = {
  // Link Google Sheet đã "Xuất bản lên web" dạng CSV (hoặc thêm ?sheet=LINK vào địa chỉ trang)
  SHEET_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpdeW4IUJJCLd1FQf0tp6Tk7QPcdKQeRlaOcJoLbx7eFPXdFi3TI3Vt-BI4rUKXCidHkQBTF--xxpL/pub?gid=416152327&single=true&output=csv",
  REFRESH_SECONDS: 15,   // tự tải lại sheet sau mỗi N giây
  // Link tab "Danh hiệu" của Google Sheet (Xuất bản lên web -> chọn đúng tab đó -> định dạng CSV). Để trống = ẩn hàng danh hiệu
  HONORS_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpdeW4IUJJCLd1FQf0tp6Tk7QPcdKQeRlaOcJoLbx7eFPXdFi3TI3Vt-BI4rUKXCidHkQBTF--xxpL/pub?gid=209915987&single=true&output=csv",
  // Tab Ảnh: bỏ ảnh vào thư mục này (nên tách riêng khỏi logo cho khỏi lẫn)
  GALLERY_DIR: "img/anh/",
  // "tên-github/tên-repo" (vd "VietanhAries/CR"). Để trống = tự đoán từ địa chỉ trang github.io
  GITHUB_REPO: "",
  // Dự phòng khi không tự đọc được thư mục (vd mở file trực tiếp trên máy): ghi tay tên file, vd ["a.jpg","b.png"]
  GALLERY_FILES: [],
  PLAYER_NAME: "Cristiano Ronaldo",   // tên hiện ở giữa phần đầu trang
  BIRTHDATE: "05/02/1985",   // ngày sinh (hiện dòng dưới tên)
  IMG_DIR: "img/"   /* img/logo.png (góc trái), img/image.png (góc phải), img/realmadrid.png ... */
};

// ===== 2. DỮ LIỆU MẪU: chỉ hiện khi SHEET_URL để trống. Có link sheet thì bỏ qua đoạn này =====
const SAMPLE = [
  {team:"CLB mẫu 1",season:"2015-2016",total:20,op:12,pe:5,fk:3},
  {team:"CLB mẫu 1",season:"2016-2017",total:25,op:15,pe:6,fk:4},
  {team:"CLB mẫu 2",season:"2017-2018",total:30,op:20,pe:6,fk:4},
  {team:"CLB mẫu 2",season:"2018-2019",total:18,op:10,pe:6,fk:2}
].map(r=>({...r,key:parseInt(r.season),logo:"",un:0}));

// ===== 3. HÀM TIỆN ÍCH =====
// $ = lấy phần tử theo id | esc = chống lỗi ký tự lạ | num = đọc số | norm = bỏ dấu, chữ thường
// slug = biến tên đội thành tên file ảnh ("Real Madrid" -> "realmadrid") | logoNext = thử các đuôi ảnh png/jpg/webp/svg
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseInt(String(v||"").replace(/[^\d-]/g,""),10);return isNaN(n)?0:n};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").trim();
const slug=n=>norm(n).replace(/[^a-z0-9]/g,"");
const EXTS=["png","jpg","jpeg","webp","svg"];
function logoNext(i){const b=i.dataset.b,n=+i.dataset.i+1;if(!b||n>=EXTS.length){i.remove();return}i.dataset.i=n;i.src=b+"."+EXTS[n]}
// SRC = link sheet đang dùng (ưu tiên ?sheet= trên địa chỉ trang, sau đó tới CONFIG.SHEET_URL)
const SRC=new URLSearchParams(location.search).get("sheet")||CONFIG.SHEET_URL;
// ===== 4. NHÃN & MÀU 3 LOẠI BÀN THẮNG =====
// Mỗi dòng: [mã loại, tên hiển thị]. Muốn đổi chữ hiển thị thì sửa chữ thứ hai.
// Màu của từng loại nằm ở CSS (--op, --pe, --fk, --un).
const CATS=[["op","Trực tiếp"],["pe","Penalty"],["fk","Đá phạt"],["un","Chưa phân loại"]];
let rows=[],team="all",view=[];

// ===== 5. ĐỌC FILE CSV =====
// parseCSV: tách văn bản CSV thành các dòng/ô (không cần sửa)
function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=""}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);r.push(row)}return r}

// parse: tìm dòng tiêu đề rồi đọc từng dòng dữ liệu.
// Cột được nhận ra theo TÊN CỘT trong sheet (không phân biệt hoa thường, không cần dấu).
// Muốn thêm tên cột khác được nhận, thêm từ khóa (đã bỏ dấu, chữ thường) vào các danh sách trong find([...]) bên dưới:
//   team = đội bóng | season = năm | total = tổng | op = trực tiếp | pe = penalty | fk = đá phạt | logo = link logo
let info="";
function parse(t){
  const a=parseCSV(t).filter(r=>r.some(c=>c.trim()));
  info=a.length+" dòng; dòng đầu: "+(a[0]||[]).slice(0,7).join(" | ");
  if(!a.length)return[];
  let hi=a.slice(0,5).findIndex(r=>{const x=r.map(norm);return x.some(c=>/doi bong|team|clb|club/.test(c))&&x.some(c=>/tong|total|truc tiep|penalty|da phat/.test(c))});
  if(hi<0)hi=0;
  const h=a[hi].map(norm);
  const find=(ks,skip)=>h.findIndex((x,i)=>i!==skip&&ks.some(k=>x.includes(k)));
  const ci={team:find(["doi bong","team","clb","cau lac bo","club"]),season:find(["nam","season","mua"]),
    total:find(["tong","total"]),logo:find(["logo"]),op:find(["truc tiep","open"]),pe:find(["penalty","phat den"])};
  ci.fk=find(["free","da phat"],ci.pe);
  ["team","season","total","op","pe","fk"].forEach((k,i)=>{if(ci[k]<0)ci[k]=i});
  return a.slice(hi+1).map(r=>{const g=k=>(r[ci[k]]||"").trim();
    const op=num(g("op")),pe=num(g("pe")),fk=num(g("fk")),s=op+pe+fk,total=Math.max(num(g("total")),s);
    return{team:g("team"),season:g("season"),key:parseInt(g("season"))||9999,logo:g("logo"),op,pe,fk,total,un:total-s}
  }).filter(x=>x.team||x.season);
}

// sum: cộng số bàn của nhiều dòng | segs: vẽ các đoạn màu trong thanh/cột
const sum=a=>a.reduce((s,r)=>({op:s.op+r.op,pe:s.pe+r.pe,fk:s.fk+r.fk,un:s.un+r.un,total:s.total+r.total}),{op:0,pe:0,fk:0,un:0,total:0});
const segs=(t,dir)=>CATS.filter(c=>t[c[0]]>0).map(c=>`<i class="${c[0]}" style="${dir}:${t[c[0]]/t.total*100}%" title="${c[1]}: ${t[c[0]]}"></i>`).join("");

// ===== 6. VẼ GIAO DIỆN =====
// render() chạy mỗi lần có dữ liệu mới hoặc khi bấm nút lọc đội.
function render(){
  // (1) Lọc theo đội đang chọn rồi tính tổng
  const names=[...new Set(rows.map(r=>r.team))];
  if(team!=="all"&&!names.includes(team))team="all";
  const f=rows.filter(r=>team==="all"||r.team===team),S=sum(f);
  // (2) Ô tổng số bàn + thanh chia 3 màu + 3 ô chú thích (Trực tiếp / Penalty / Đá phạt)
  $("title").textContent=team==="all"?"Tổng số bàn thắng":"Bàn thắng – "+team;
  $("total").textContent=S.total;
  $("mainbar").innerHTML=S.total?segs(S,"width"):"";
  $("leg").innerHTML=CATS.filter(c=>c[0]!=="un"||S.un>0).map(c=>`<div style="border-color:var(--${c[0]})"><div class="num">${S[c[0]]}</div><span>${c[1]} · ${S.total?Math.round(S[c[0]]/S.total*100):0}%</span></div>`).join("");
  // (3) Các nút lọc đội
  $("chips").innerHTML=["all",...names].map(n=>`<button data-t="${esc(n)}" aria-pressed="${n===team}">${n==="all"?"Tất cả đội":esc(n)}</button>`).join("");

  // (4) Biểu đồ cột đứng theo đội
  /* Mỗi "lần tham gia" của một đội là 1 cột riêng: các mùa liền nhau thì gộp, cách quãng thì tách */
  const byTeam={};f.forEach(r=>(byTeam[r.team]=byTeam[r.team]||[]).push(r));
  const spells=[];
  Object.entries(byTeam).forEach(([n,l])=>{
    let cur=null,pe=0,pr=false;
    [...l].sort((x,y)=>x.key-y.key).forEach(r=>{
      const ys=(r.season.match(/\d{4}/g)||[]).map(Number);
      if(ys.length){
        const a=Math.min(...ys),z=Math.max(...ys),rg=a!==z;
        if(!cur||a>pe+(pr?0:1)){cur={n,rows:[]};spells.push(cur);pe=z;pr=rg}
        else if(z>=pe){pe=z;pr=rg}
        cur.rows.push(r);
      }else{if(!cur){cur={n,rows:[]};spells.push(cur)}cur.rows.push(r)}
    });
  });
  /* Sắp xếp theo thời gian tham gia (năm bắt đầu); đội tuyển quốc gia luôn nằm cuối.
     Muốn đổi cách nhận ra đội tuyển: sửa các từ trong /dtqg|doi tuyen|national/ (viết thường, không dấu) */
  const isNat=n=>/dtqg|doi tuyen|national/.test(norm(n));
  const startOf=rs=>{const y=rs.flatMap(r=>(r.season.match(/\d{4}/g)||[]).map(Number));return y.length?Math.min(...y):9999};
  const tl=spells.map(sp=>({n:sp.n,rows:sp.rows,t:sum(sp.rows),st:startOf(sp.rows),nat:isNat(sp.n)}))
    .sort((x,y)=>(x.nat-y.nat)||(x.st-y.st)||(y.t.total-x.t.total));
  const tm=Math.max(1,...tl.map(x=>x.t.total));
  view=tl;   // lưu danh sách cột đang hiển thị để biết bấm vào đội nào
  $("teams").innerHTML=tl.map(({n,rows:l,t},ix)=>{
    const ys=l.flatMap(r=>(r.season.match(/\d{4}/g)||[]).map(Number));
    const a=Math.min(...ys),z=Math.max(...ys),yr=ys.length?(a===z?""+a:a+" - "+z):"";
    const lg=(byTeam[n].find(r=>/^https?:\/\//i.test(r.logo))||{}).logo;
    const ini=n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const base=CONFIG.IMG_DIR+slug(n);
    return `<div class="tcol" data-s="${ix}" tabindex="0" role="button" aria-label="Xem chi tiết ${esc(n)}"><span class="t">${t.total}</span><div class="stack" style="--r:${t.total/tm}">${segs(t,"height")}</div><div class="nmrow"><span class="nm">${esc(n)}</span><span class="lg"><span class="badge">${esc(ini)}</span><img src="${esc(lg||base+".png")}" alt="" data-b="${esc(lg?"":base)}" data-i="0" onerror="logoNext(this)"></span></div><span>${esc(yr)}</span></div>`}).join("")||'<span class="note">Chưa có dữ liệu.</span>';

  // (5) Bảng chi tiết từng mùa (nằm trong mục bấm để mở)
  const showUn=S.un>0;
  $("tbl").innerHTML=`<tr><th>Mùa</th><th>Đội</th><th>Tổng</th><th>Trực tiếp</th><th>Penalty</th><th>Đá phạt</th>${showUn?"<th>Chưa phân loại</th>":""}</tr>`+
    [...f].sort((a,b)=>a.key-b.key).map(r=>`<tr><td>${esc(r.season)}</td><td>${esc(r.team)}</td><td><b>${r.total}</b></td><td>${r.op}</td><td>${r.pe}</td><td>${r.fk}</td>${showUn?`<td>${r.un}</td>`:""}</tr>`).join("")+
    `<tr><td><b>Cộng</b></td><td></td><td><b>${S.total}</b></td><td>${S.op}</td><td>${S.pe}</td><td>${S.fk}</td>${showUn?`<td>${S.un}</td>`:""}</tr>`;
}

// ===== 8. DANH HIỆU =====
// Đọc tab "Danh hiệu" trong Google Sheet. Cột (chỉ cần có "Danh hiệu"):
//   Danh hiệu | Mùa | Đội | Số lần | Ảnh | Ghi chú
// Cách ghi 1 (khuyên dùng) - mỗi dòng là MỘT lần đạt: "Quả bóng vàng | 2007-2008 | Man United" (bỏ trống Số lần = 1 lần).
//   -> vừa tính vào hàng danh hiệu ở đầu trang, vừa hiện trong bảng chi tiết mùa của đội đó.
// Cách ghi 2 - dòng tổng hợp: "Cúp C1 | | | 5"  -> chỉ tính vào hàng danh hiệu, không hiện trong chi tiết mùa.
// Cột Mùa và Đội phải ghi GIỐNG tab chính (vd "2007-2008", "Man United"). Danh hiệu ghi theo năm (vd "2008")
// thì tính cho mùa kết thúc năm đó (2007-2008). Cột Ảnh = tên file trong img/ hoặc link https://.
const HSRC=new URLSearchParams(location.search).get("honors")||CONFIG.HONORS_URL;
let honorsKey="",honorsAll=[];
function parseHonors(t){
  const a=parseCSV(t).filter(r=>r.some(c=>c.trim()));if(!a.length)return[];
  let hi=a.slice(0,5).findIndex(r=>r.map(norm).some(c=>/danh hieu|title|honou?r/.test(c)));if(hi<0)hi=0;
  const h=a[hi].map(norm);
  const find=re=>h.findIndex(x=>re.test(x));
  const ci={name:find(/danh hieu|title|honou?r/),count:find(/so lan|count|so luong/),season:find(/^mua|season|^nam|year/),
    team:find(/^doi|team|clb|club/),img:find(/^anh\b|image|hinh|icon/),note:find(/ghi chu|note/)};
  if(ci.name<0)ci.name=0;
  const out=[];
  a.slice(hi+1).forEach(r=>{
    const g=k=>ci[k]<0?"":(r[ci[k]]||"").trim(),name=g("name");if(!name)return;
    const ss=g("season").split(/[;,\n]/).map(x=>x.trim()).filter(Boolean);   // 1 ô có thể ghi nhiều mùa, cách nhau bằng dấu ;
    if(ss.length>1)ss.forEach(se=>out.push({name,count:1,season:se,team:g("team"),img:g("img"),note:g("note")}));
    else out.push({name,count:num(g("count")),season:ss[0]||"",team:g("team"),img:g("img"),note:g("note")});
  });
  return out;
}
// Gộp theo tên danh hiệu để vẽ hàng danh hiệu ở đầu trang
function aggHonors(list){
  const m=new Map();
  list.forEach(h=>{const g=m.get(h.name)||{name:h.name,count:0,img:"",note:[]};
    g.count+=h.count||(h.season||h.team?1:0);if(h.img&&!g.img)g.img=h.img;
    const nt=h.note||(h.season?h.season+(h.team?" ("+h.team+")":""):"");if(nt&&!g.note.includes(nt))g.note.push(nt);
    m.set(h.name,g)});
  return[...m.values()].map(g=>({...g,note:g.note.join(", ")}));
}
// Ảnh minh họa danh hiệu: cột Ảnh, nếu trống thì img/<tên danh hiệu viết liền không dấu>.png
function honorPic(name,imgf,cls){
  const isUrl=/^https?:\/\//i.test(imgf||"");
  const base=CONFIG.IMG_DIR+(imgf&&!isUrl?imgf.replace(/\.(png|jpe?g|webp|svg)$/i,""):slug(name));
  return `<span class="pic ${cls||""}"><span class="b2">★</span><img src="${esc(isUrl?imgf:base+".png")}" alt="" data-b="${esc(isUrl?"":base)}" data-i="0" onerror="logoNext(this)"></span>`;
}
function renderHonors(list){
  const el=$("honors"),key=JSON.stringify(list);
  if(!list.length){el.hidden=true;el.innerHTML="";honorsKey="";return}
  if(key===honorsKey)return;   // không đổi thì khỏi vẽ lại
  honorsKey=key;el.hidden=false;
  el.innerHTML=list.map(h=>`<div class="h" title="${esc(h.note||h.name)}">${honorPic(h.name,h.img)}<span class="ht"><span class="hc">${h.count?"×"+h.count:""}</span><span class="hn">${esc(h.name)}</span></span></div>`).join("");
}
async function loadHonors(){
  if(!HSRC){honorsAll=[];renderHonors([]);return}
  try{
    const res=await fetch(toCsv(HSRC),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const t=await res.text();
    if(/<html/i.test(t.slice(0,300)))throw new Error("tab chưa xuất bản");
    const list=parseHonors(t);
    if(!list.length)throw new Error("tab trống hoặc sai tên cột");
    honorsAll=list;renderHonors(aggHonors(honorsAll));
  }catch(e){
    // Đã có dữ liệu cũ thì giữ nguyên; chưa có thì báo lý do để dễ tìm lỗi
    if(!honorsAll.length){const el=$("honors");el.hidden=false;honorsKey="";
      el.innerHTML='<span class="note" style="grid-column:1/-1">Chưa đọc được tab Danh hiệu ('+esc(e.message)+'). Kiểm tra link HONORS_URL (xuất bản đúng tab, định dạng CSV) và tên cột trong dòng 1.</span>'}
  }
}

// ===== 10. CHI TIẾT ĐỘI (bấm vào một cột đội) =====
// Hiện bảng từng mùa của lần tham gia đó: số bàn (chia 3 loại) + danh hiệu đạt được trong mùa.
const yrs=x=>((x||"").match(/\d{4}/g)||[]).map(Number);
// Danh hiệu h có thuộc dòng mùa r không? (cùng đội + mùa khớp; dòng gộp nhiều mùa thì danh hiệu nằm trong khoảng đó)
function inRow(h,r){
  if(!h.team||norm(h.team)!==norm(r.team))return false;
  const hy=yrs(h.season),ry=yrs(r.season);if(!hy.length||!ry.length)return false;
  const ha=Math.min(...hy),hz=Math.max(...hy),ra=Math.min(...ry),rz=Math.max(...ry);
  if(rz-ra>1)return ha>=ra&&hz<=rz;
  return hz-ha<=1&&hz===rz;
}
function openTeam(i){
  const sp=view[i];if(!sp)return;
  const S=sp.t,rs=[...sp.rows].sort((x,y)=>x.key-y.key),showUn=S.un>0;
  const ys=yrs(rs.map(r=>r.season).join(" ")),a=Math.min(...ys),z=Math.max(...ys);
  const yr=ys.length?(a===z?""+a:a+" - "+z):"";
  const lgu=(sp.rows.find(r=>/^https?:\/\//i.test(r.logo))||{}).logo,base=CONFIG.IMG_DIR+slug(sp.n);
  const ini=sp.n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const grp=l=>{const m=new Map();l.forEach(h=>{const g=m.get(h.name)||{...h,n:0,ss:[]};g.n+=h.count||1;if(h.season&&!g.ss.includes(h.season))g.ss.push(h.season);m.set(h.name,g)});return[...m.values()]};   // cùng danh hiệu -> ×N + danh sách mùa
  const chip=h=>`<span class="hb">${honorPic(h.name,h.img,"sm")}<span>${esc(h.name)}${h.n>1?" ×"+h.n:""}${h.ss&&h.ss.length?` <span class="note">(${esc(h.ss.join(", "))})</span>`:""}</span></span>`;
  // Dòng mùa gộp nhiều năm (vd 07/2009 - 07/2018) thì ghi rõ các mùa đạt danh hiệu; dòng một mùa thì không cần
  const multi=r=>{const y=yrs(r.season);return y.length>0&&Math.max(...y)-Math.min(...y)>1};
  const cell=(l,sh)=>l.length?grp(l).map(h=>chip(sh?h:{...h,ss:[]})).join(""):"—";
  const teamRows=rows.filter(r=>norm(r.team)===norm(sp.n));
  const first=view.findIndex(x=>norm(x.n)===norm(sp.n))===i;   // danh hiệu chưa khớp mùa nào chỉ liệt kê ở lần đầu của đội
  const other=first?honorsAll.filter(h=>h.team&&norm(h.team)===norm(sp.n)&&!teamRows.some(r=>inRow(h,r))):[];
  // Khối "Danh hiệu theo mùa": chỉ hiện khi đội có dòng mùa gộp nhiều năm (vd 07/2009 - 07/2018).
  // Lấy mùa từ tab Danh hiệu nên KHÔNG cần tách số bàn thắng thành từng mùa trong tab chính.
  const aggH=[];rs.forEach(r=>{if(multi(r))honorsAll.filter(h=>inRow(h,r)).forEach(h=>aggH.push(h))});
  const bySeason=new Map();aggH.forEach(h=>{const k=h.season.trim();if(!bySeason.has(k))bySeason.set(k,[]);bySeason.get(k).push(h)});
  const seasonBlock=aggH.length?'<div class="hs"><div class="hst">Danh hiệu theo mùa</div>'+
    [...bySeason.entries()].sort((x,y)=>Math.max(...yrs(x[0]))-Math.max(...yrs(y[0]))).map(([se,l])=>`<div class="hsr"><span class="hsy">${esc(se)}</span><span>${grp(l).map(h=>chip({...h,ss:[]})).join("")}</span></div>`).join("")+'</div>':"";
  $("mdb").innerHTML=`<div class="mh"><span class="lg"><span class="badge">${esc(ini)}</span><img src="${esc(lgu||base+".png")}" alt="" data-b="${esc(lgu?"":base)}" data-i="0" onerror="logoNext(this)"></span><div><div class="mn">${esc(sp.n)}</div><div class="note">${esc(yr)}</div></div><div class="mtot"><b>${S.total}</b>bàn</div></div>
    ${S.total?`<div class="sb" style="margin:8px 0 10px">${segs(S,"width")}</div>`:""}
    <div class="scroll"><table class="mt"><tr><th>Mùa</th><th>Tổng</th><th>Trực tiếp</th><th>Penalty</th><th>Đá phạt</th>${showUn?"<th>Chưa phân loại</th>":""}<th class="hh">Danh hiệu</th></tr>`+
    rs.map(r=>`<tr><td>${esc(r.season)}</td><td><b>${r.total}</b></td><td>${r.op}</td><td>${r.pe}</td><td>${r.fk}</td>${showUn?`<td>${r.un}</td>`:""}<td class="hh">${cell(honorsAll.filter(h=>inRow(h,r)))}</td></tr>`).join("")+
    `<tr><td><b>Cộng</b></td><td><b>${S.total}</b></td><td>${S.op}</td><td>${S.pe}</td><td>${S.fk}</td>${showUn?`<td>${S.un}</td>`:""}<td class="hh"></td></tr></table></div>`+seasonBlock+
    (other.length?`<p class="mo"><b>Danh hiệu khác của đội:</b> ${other.map(h=>chip({...h,n:h.count||1,ss:h.season?[h.season]:[]})).join(" ")}</p>`:"")+
    (!honorsAll.length?`<p class="mo note">${HSRC?"Chưa có dữ liệu danh hiệu (tab Danh hiệu trống, chưa đọc được hoặc sai tên cột).":"Chưa nối tab Danh hiệu: điền link vào HONORS_URL trong phần CONFIG."}</p>`:"");
  $("md").hidden=false;
}

// ===== 9. TAB ẢNH =====
// Trang web tĩnh không tự biết trong thư mục có những file nào, nên khi chạy trên GitHub Pages trang hỏi GitHub
// (api.github.com) danh sách file trong GALLERY_DIR, rồi lưu tạm 10 phút để đỡ gọi nhiều.
// Muốn thêm ảnh: chỉ cần upload ảnh vào thư mục img/anh/ trên GitHub, không phải sửa code.
const IMG_RE=/\.(png|jpe?g|webp|gif|avif)$/i;
let photos=[],pi=0,galLoaded=false;
function repoGuess(){
  const q=new URLSearchParams(location.search).get("repo");   // ?repo=ten/repo dùng để thử
  if(q)return q;
  if(CONFIG.GITHUB_REPO)return CONFIG.GITHUB_REPO;
  const h=location.hostname;
  if(h.endsWith(".github.io"))return h.split(".")[0]+"/"+(location.pathname.split("/")[1]||h);
  return "";
}
async function listPhotos(){
  const dir=CONFIG.GALLERY_DIR.replace(/\/+$/,""),repo=repoGuess(),ck="gal:"+repo+"/"+dir;
  if(repo){
    try{const c=JSON.parse(localStorage.getItem(ck)||"null");if(c&&Date.now()-c.t<600000)return c.f}catch(e){}
    try{
      const res=await fetch("https://api.github.com/repos/"+repo+"/contents/"+dir);
      if(!res.ok)throw new Error("HTTP "+res.status);
      const f=(await res.json()).filter(x=>x.type==="file"&&IMG_RE.test(x.name)).map(x=>x.name);
      try{localStorage.setItem(ck,JSON.stringify({t:Date.now(),f}))}catch(e){}
      return f;
    }catch(e){}
  }
  return CONFIG.GALLERY_FILES.filter(n=>IMG_RE.test(n));
}
async function loadGallery(){
  const msg=$("galmsg");msg.hidden=false;msg.textContent="Đang tải danh sách ảnh…";
  const f=(await listPhotos()).sort((a,b)=>a.localeCompare(b,"vi",{numeric:true}));
  galLoaded=true;
  photos=f.map(n=>CONFIG.GALLERY_DIR+encodeURIComponent(n));
  $("gal").innerHTML=photos.map((u,i)=>`<img src="${esc(u)}" loading="lazy" decoding="async" alt="Ảnh ${i+1}" data-i="${i}" onerror="this.remove()">`).join("");
  $("tabph").textContent=photos.length?" ("+photos.length+")":"";
  msg.hidden=photos.length>0;
  if(!photos.length)msg.textContent="Chưa có ảnh. Hãy bỏ ảnh vào thư mục "+CONFIG.GALLERY_DIR+" trên GitHub (trang tự đọc danh sách). Nếu đang mở file trực tiếp trên máy thì điền tên file vào CONFIG.GALLERY_FILES.";
}
function showTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tab===t)));
  $("tab-stats").hidden=t!=="stats";$("tab-photos").hidden=t!=="photos";
  if(t==="photos"&&!galLoaded)loadGallery();
  try{history.replaceState(null,"",t==="photos"?"#anh":location.pathname+location.search)}catch(e){}
}
function openLb(i){pi=(i+photos.length)%photos.length;$("lbi").src=photos[pi];$("lb").hidden=false}
function closeLb(){$("lb").hidden=true}

// ===== 7. TẢI DỮ LIỆU TỪ GOOGLE SHEET =====
// toCsv: chuẩn hóa link sheet (link "pub?...output=csv" dùng nguyên, không cần sửa)
function toCsv(u){
  let url=u;const m=u.match(/\/spreadsheets\/d\/([^/]+)/);
  if(m&&!/\/pub\?|gviz/.test(u)){const g=(u.match(/[#&?]gid=(\d+)/)||[])[1];
    url=`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1${g?"&gid="+g:""}`}
  return url+(url.includes("?")?"&":"?")+"_="+Date.now();
}

// load: tải sheet -> đọc -> vẽ lại. Báo lỗi bằng dòng vàng nếu không đọc được.
async function load(){
  if(!SRC){rows=SAMPLE;$("warn").innerHTML='<div class="warn">Đang hiển thị dữ liệu mẫu. Dán link Google Sheet vào <b>CONFIG.SHEET_URL</b> trong file để hiện số liệu thật.</div>';
    $("status").textContent="Dữ liệu mẫu";render();return}
  try{
    const res=await fetch(toCsv(SRC),{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const t=await res.text();
    if(/<html/i.test(t.slice(0,300)))throw new Error("Sheet chưa được chia sẻ công khai");
    rows=parse(t);
    $("warn").innerHTML=rows.length?"":'<div class="warn">Đọc được sheet nhưng không có dòng dữ liệu ('+esc(info)+'). Dòng 1 cần có các tên cột: Đội bóng, Năm, Tổng số bàn, Trực tiếp, Penalty, Đá phạt.</div>';
    $("status").textContent="Cập nhật lúc "+new Date().toLocaleTimeString("vi-VN");render();
  }catch(e){
    $("status").textContent="Lỗi tải dữ liệu";
    $("warn").innerHTML='<div class="warn">Không đọc được Google Sheet ('+esc(e.message)+'). Hãy chia sẻ sheet ở chế độ "Bất kỳ ai có đường liên kết đều xem được" và kiểm tra lại link.'+(rows.length?" Đang hiển thị dữ liệu lần tải trước.":"")+'</div>';
    if(rows.length)render();
  }
}
// Khởi động: điền tên/ngày sinh, nạp ảnh logo.png + image.png, gắn nút bấm, tải dữ liệu và hẹn giờ tự làm mới
$("pname").textContent=CONFIG.PLAYER_NAME;
$("pdob").textContent="Sinh ngày "+CONFIG.BIRTHDATE;
$("logoimg").src=CONFIG.IMG_DIR+"logo.png";
$("photoimg").src=CONFIG.IMG_DIR+"image.png";
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){team=b.dataset.t;render()}});
$("refresh").addEventListener("click",load);
load();setInterval(load,CONFIG.REFRESH_SECONDS*1000);
loadHonors();setInterval(loadHonors,CONFIG.REFRESH_SECONDS*1000);
// Tab ảnh: bấm tab, bấm ảnh để phóng to, phím ← → Esc
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab)});
$("gal").addEventListener("click",e=>{const i=e.target.dataset.i;if(i!==undefined)openLb(+i)});
$("lbx").onclick=closeLb;$("lbp").onclick=()=>openLb(pi-1);$("lbn").onclick=()=>openLb(pi+1);
$("lb").addEventListener("click",e=>{if(e.target===$("lb"))closeLb()});
document.addEventListener("keydown",e=>{if($("lb").hidden)return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")openLb(pi-1);if(e.key==="ArrowRight")openLb(pi+1)});
// Bảng chi tiết đội: bấm cột đội (hoặc Enter), đóng bằng nút X, bấm ra ngoài hoặc Esc
$("teams").addEventListener("click",e=>{const c=e.target.closest(".tcol");if(c)openTeam(+c.dataset.s)});
$("teams").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const c=e.target.closest(".tcol");if(c){e.preventDefault();openTeam(+c.dataset.s)}}});
$("mdx").onclick=()=>{$("md").hidden=true};
$("md").addEventListener("click",e=>{if(e.target===$("md"))$("md").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("md").hidden=true});
if(location.hash==="#anh")showTab("photos");
</script>
